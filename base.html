.card{width:100px;height:120px;perspective:1000px;border-radius:12px}
.cardInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}
.card.flipped .cardInner{transform:rotateY(180deg)}
.cardFace{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:46px;backface-visibility:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.12)}

.cardFront span{font-size:18px;font-weight:700;color:#333;text-align:center}
.card:hover{transform:translateY(-4px)}
.popup{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.98);padding:18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.18);z-index:50;display:none}
.popup.show{display:block}
.btn{padding:8px 12px;border-radius:10px;background:#2563eb;color:#fff;border:none;cursor:pointer}

.confetti{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti span{position:absolute;animation:fall 1200ms linear infinite;opacity:0.9}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
#menu{position:fixed;top:0;left:0;right:0;background:#f0f0f0;padding:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:10}

  (function () {
    let startX = 0;
    let startY = 0;
    const minSwipeDistance = 50; // px

    document.addEventListener('touchstart', function (e) {
        const touch = e.changedTouches[0];
        startX = touch.clientX;
        startY = touch.clientY;
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
        const touch = e.changedTouches[0];

        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;

        // Bỏ qua nếu vuốt dọc nhiều hơn vuốt ngang
        if (Math.abs(deltaY) > Math.abs(deltaX)) {
            return;
        }

        if (Math.abs(deltaX) < minSwipeDistance) {
            return;
        }

        if (deltaX < 0) {
            // Swipe trái
           prevPage();
        } else {
            // Swipe phải
            nextPage();
        }
    }, { passive: true });
})();

function getDisplayIndex(index){
 return randomMode ? (randomOrder[index] ?? index) : index;
}
function show(i){

 slides.forEach(s=>s.classList.remove('active'));
 slides[displayIndex].classList.add('active');
 document.getElementById('counter').innerText=(safe+1)+' / '+(randomMode ? randomOrder.length : slides.length);
 document.getElementById('bar').style.width=((safe+1)/(randomMode ? randomOrder.length : slides.length)*100)+'%';
 current=safe;
}
function nextPage(){
 const maxIndex=randomMode ? randomOrder.length-1 : slides.length-1;
 if(current<maxIndex){current++;show(current);} 
}
function prevPage(){

}

  const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  console.log("shuffle", a);
  return a;
}

const memoryLevels = [
  ['A','A','B','B'],
  ['A','A','B','B','C','C'],
  ['A','A','B','B','C','C','D','D'],
  ['A','A','B','B','C','C','D','D','E','E'],
  ['A','A','B','B','C','C','D','D','E','E','F','F'],
  ['A','A','B','B','C','C','D','D','E','E','F','F','G','G'],
  ['A','A','B','B','C','C','D','D','E','E','F','F','G','G','H','H']
  ['A','A','B','B','C','C','D','D','E','E','F','F','G','G','H','H','J','J']
];



function openMemoryGame(){
 
  setActiveMenuButton('memoryGame');
  loadMemoryGame();
}

function loadMemoryGame(){
  const root = document.createElement('div');
  root.className='memory-game-root';
  root.innerHTML = `
    <div class="game-controls">
      <div class="game-stats">Score: <span id="mgScore">0</span></div>
      <div class="game-stats">Moves: <span id="mgMoves">0</span></div>
      <div class="game-stats">Time: <span id="mgTimer">00:00</span></div>
      <div class="game-stats">Level: <span id="mgLevel">1</span></div>
      <div style="margin-left:12px;"><button id="mgRestart" class="btn">Restart</button> <button id="mgBack" class="btn secondary">Back</button></div>
    </div>
    <div id="mgBoard" class="board"></div>
  `;
  content.innerHTML='';
  content.appendChild(root);
  document.getElementById('mgRestart').addEventListener('click', ()=>startLevel(mgState.level));
  document.getElementById('mgBack').addEventListener('click', ()=>{renderCards('hiragana'); setActiveMenuButton('hiragana'); stopTimer();});
  startLevel(1);
}

function startLevel(level){
  stopTimer();
  mgState.level=level; mgState.score=0; mgState.moves=0; mgState.time=0; mgState.firstFlip=null; mgState.secondFlip=null; mgState.lock=false; mgState.matches=0; mgState.startTime=null;
  document.getElementById('mgScore').innerText = mgState.score;
  document.getElementById('mgMoves').innerText = mgState.moves;
  document.getElementById('mgTimer').innerText = '00:00';
  document.getElementById('mgLevel').innerText = mgState.level + "/" + memoryLevels.length;
  const emojis = memoryLevels[level-1].slice();
  shuffle(emojis);
  const pairs = emojis.length/2;
  mgState.totalPairs = pairs;
  const board = document.getElementById('mgBoard');
  const cols = Math.min(8, Math.ceil(Math.sqrt(emojis.length)));
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  board.innerHTML = '';
  emojis.forEach((emoji,i)=>{
    console.log("aaa=", emoji);
     const cardImg = englishAbcCards.find(item => item.text === emoji);
    const card = document.createElement('div'); card.className='card'; card.dataset.index=i; card.dataset.emoji=emoji;
    const inner = document.createElement('div'); inner.className='cardInner';
    const back = document.createElement('div'); back.className='cardFace cardBack'; back.innerText='❓';
    const front = document.createElement('div'); front.className='cardFace cardFront'; front.innerText=cardImg?.emoji;
    
    const frontChild = document.createElement('span'); frontChild.className=''; frontChild.innerText=cardImg?.reading;
    front.appendChild(frontChild);
    inner.appendChild(back); inner.appendChild(front); card.appendChild(inner);
    card.addEventListener('click', ()=>onCardClick(card));
    board.appendChild(card);
  });
}

function onCardClick(card){
  if(mgState.lock) return;
  if(card.classList.contains('flipped')) return;
  if(!mgState.startTime){ startTimer(); mgState.startTime=Date.now(); }
  if(!mgState.firstFlip){
    card.classList.add('flipped'); mgState.firstFlip=card; return;
  }
  if(mgState.firstFlip && !mgState.secondFlip){
    card.classList.add('flipped'); mgState.secondFlip=card; mgState.lock=true;
    mgState.moves++; document.getElementById('mgMoves').innerText=mgState.moves;
    if(mgState.firstFlip.dataset.emoji === mgState.secondFlip.dataset.emoji){
      mgState.matches++;
      mgState.score += 10;
      document.getElementById('mgScore').innerText=mgState.score;
      mgState.firstFlip=null; mgState.secondFlip=null; mgState.lock=false;
      if(mgState.matches === mgState.totalPairs) levelComplete();
    } else {
      setTimeout(()=>{
        mgState.firstFlip.classList.remove('flipped');
        mgState.secondFlip.classList.remove('flipped');
        mgState.firstFlip=null; mgState.secondFlip=null; mgState.lock=false;
      },1000);
    }
  }
}

function startTimer(){
  stopTimer(); mgState.timerId = setInterval(()=>{
    mgState.time = Math.floor((Date.now() - mgState.startTime)/1000);
    document.getElementById('mgTimer').innerText = formatTime(mgState.time);
  },500);
}
function stopTimer(){ if(mgState.timerId) clearInterval(mgState.timerId); mgState.timerId=null; }
function formatTime(s){ const mm = String(Math.floor(s/60)).padStart(2,'0'); const ss = String(s%60).padStart(2,'0'); return `${mm}:${ss}`; }

function levelComplete(){
  stopTimer();
  const popup = document.getElementById('memoryPopup');
  const msg = document.getElementById('popupMsg');
  msg.innerText = `Level ${mgState.level} Complete — Score: ${mgState.score} — Time: ${formatTime(mgState.time)}`;
  popup.classList.add('show'); popup.setAttribute('aria-hidden','false');
  document.getElementById('nextLevelBtn').onclick = ()=>{
    popup.classList.remove('show'); popup.setAttribute('aria-hidden','true');
    if(mgState.level < memoryLevels.length) startLevel(mgState.level+1); else finalWin();
  };
  document.getElementById('playAgainBtn').onclick = ()=>{ popup.classList.remove('show'); popup.setAttribute('aria-hidden','true'); startLevel(mgState.level); };
  saveHighscore(mgState.level, mgState.score, mgState.time);
  if(mgState.level === memoryLevels.length) showConfetti();
}

function finalWin(){
  const popup = document.getElementById('memoryPopup');
  const totalScore = mgState.score;
  const totalTime = mgState.time;
  popup.classList.add('show'); popup.setAttribute('aria-hidden','false');
  document.getElementById('popupMsg').innerText = `You finished all levels! Score: ${totalScore} Time: ${formatTime(totalTime)}`;
  document.getElementById('nextLevelBtn').innerText='Play Again';
  document.getElementById('nextLevelBtn').onclick = ()=>{ popup.classList.remove('show'); popup.setAttribute('aria-hidden','true'); startLevel(1); document.getElementById('nextLevelBtn').innerText='Next Level'; };
  showConfetti();
}

function saveHighscore(level, score, time){
  const key = `mg_highscore_level_${level}`;
  const prev = JSON.parse(localStorage.getItem(key) || 'null');
  if(!prev || score > prev.score || (score===prev.score && time < prev.time)){
    localStorage.setItem(key, JSON.stringify({score, time, date:Date.now()}));
  }
}

function showConfetti(){
  const conf = document.getElementById('confetti'); conf.innerHTML=''; conf.style.display='block';
  for(let i=0;i<30;i++){ const s = document.createElement('span'); s.innerText=['✨','🎉','🎊','🌟'][i%4]; s.style.left=(Math.random()*100)+'%'; s.style.fontSize=(12+Math.random()*36)+'px'; s.style.top='-10%'; s.style.animationDuration=(800+Math.random()*1200)+'ms'; conf.appendChild(s); }
  setTimeout(()=>{ conf.innerHTML=''; conf.style.display='none'; },2500);
}
