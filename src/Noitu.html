<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7ff">
    <title>かんじを つなごう！</title>
    <style>
        :root { color-scheme: light; font-family: "Segoe UI", "Noto Sans JP", sans-serif; color: #26324b; background: #f5f7ff; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at top left, #e7f4ff, transparent 38%), #f5f7ff; }
        button, a { font: inherit; }
        .container { width: min(100%, 900px); margin: 0 auto; padding: clamp(20px, 4vw, 36px); border: 1px solid #e4e9f5; border-radius: 28px; background: rgba(255,255,255,.94); box-shadow: 0 18px 55px rgba(40,55,100,.12); text-align: center; }
        .topbar { display: flex; justify-content: flex-start; margin-bottom: 10px; }
        .back-home-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 15px; border: 1px solid #dce4f4; border-radius: 999px; color: #334568; text-decoration: none; font-weight: 700; background: #fff; }
        .back-home-btn:hover { background: #f0f5ff; }
        h1 { margin: 8px 0 22px; font-size: clamp(1.8rem, 5vw, 2.5rem); color: #283653; }
        .grade-selector { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 22px; }
        .grade-tab { min-height: 58px; padding: 10px 12px; border: 2px solid #e4e9f5; border-radius: 16px; color: #485875; background: #fff; font-weight: 750; cursor: pointer; transition: .2s ease; }
        .grade-tab:hover { transform: translateY(-2px); border-color: #9bb9f4; }
        .grade-tab[aria-pressed="true"] { color: #fff; border-color: #557fe3; background: linear-gradient(135deg, #678eea, #8169d8); box-shadow: 0 6px 15px #667eea44; }
        .game-info { display: flex; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 16px; background: #f1f5ff; font-weight: 750; }
        .stat { padding: 8px 14px; border-radius: 999px; color: #fff; background: #547fdf; }
        .kanji-display { min-height: 145px; display: grid; place-items: center; margin: 18px 0; color: #293858; font-size: 6rem; font-weight: 700; text-shadow: 0 5px 12px #202f5014; }
        .kanji-reading { min-height: 1.6em; margin: -16px 0 18px; color: #73809a; font-size: 1.35rem; font-weight: 650; letter-spacing: .08em; }
        .hint-container { min-height: 68px; display: grid; place-items: center; padding: 14px; border-radius: 16px; background: #fff8e5; }
        .hint-text { color: #594a2e; font-size: 1.08rem; line-height: 1.6; overflow-wrap: anywhere; }
        .hint-button { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 4px; padding: 11px 20px; border: 0; border-radius: 999px; color: #fff; background: #547fdf; font-weight: 750; cursor: pointer; }
        .hint-button:hover:not(:disabled) { background: #3e67c4; }
        .hint-button:disabled { background: #aab3c4; cursor: not-allowed; }
        .emoji-container { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 22px 0 14px; }
        .emoji-item { min-width: 0; aspect-ratio: 1; display: grid; place-items: center; border: 2px solid #edf0f6; border-radius: 20px; background: #fff; box-shadow: 0 5px 12px #28365312; font-size: clamp(3rem, 11vw, 6rem); cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
        .emoji-item:hover:not(:disabled) { transform: translateY(-4px); box-shadow: 0 10px 20px #28365320; }
        .emoji-item:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #245fd4; outline-offset: 3px; }
        .emoji-item:disabled { cursor: default; }
        .emoji-item.correct { border-color: #78d49b; background: #c9f5d8; animation: pulse .8s infinite; }
        .emoji-item.incorrect { border-color: #f29393; background: #ffd9d9; animation: shake .25s; }
        @keyframes pulse { 50% { transform: scale(1.04); } }
        @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        .message { min-height: 32px; margin: 12px 0; font-size: 1.15rem; font-weight: 750; }
        .success { color: #16834c; } .error { color: #cc4545; }
        .progress-container { margin: 16px 0 8px; }
        .progress-label { margin-bottom: 7px; color: #596781; font-size: .92rem; font-weight: 700; }
        .progress-bar { height: 14px; overflow: hidden; border-radius: 99px; background: #e9edf5; }
        .progress { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #547fdf, #9170e2); transition: width .35s ease; }
        .achievements { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
        .achievement { padding: 7px 12px; border-radius: 99px; color: #fff; background: #e0a92f; font-size: .88rem; font-weight: 700; }
        .achievement.locked { color: #667085; background: #edf0f5; }
        .loading { color: #52617e; padding: 26px; }
        @media (max-width: 680px) { body { padding: 12px; } .container { padding: 18px 14px; border-radius: 22px; } .grade-selector { grid-template-columns: repeat(2, minmax(0,1fr)); } .game-info { font-size: .92rem; } .kanji-display { min-height: 115px; font-size: 4.5rem; } .kanji-reading { margin-top: -10px; font-size: 1.2rem; } .emoji-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="container">
        <div class="topbar"><a class="back-home-btn" href="/" aria-label="メニューに戻る"><i data-lucide="arrow-left" aria-hidden="true"></i> メニューに戻る</a></div>
        <h1>かんじを つなごう！</h1>
        <nav class="grade-selector" aria-label="学年を選択">
            <button class="grade-tab" type="button" data-grade="grade1" aria-pressed="false">🌸 lớp 1 (80 từ)</button>
            <button class="grade-tab" type="button" data-grade="grade2" aria-pressed="false">🌿 lớp 2 (190 từ)</button>
            <button class="grade-tab" type="button" data-grade="grade3" aria-pressed="false">🍁 lớp 3 (200 từ)</button>
            <button class="grade-tab" type="button" data-grade="all" aria-pressed="false">🎲 Trộn cả 3 (470 từ)</button>
        </nav>
        <div class="game-info" aria-live="polite">
            <div class="stat"><i data-lucide="trophy" aria-hidden="true"></i> 点数: <span id="score">0</span></div>
            <div class="stat"><i data-lucide="layers" aria-hidden="true"></i> <span id="gradeLabel">Lớp 1</span> · <span id="questionCount">0 / 80</span></div>
        </div>
        <div class="kanji-display" id="kanji" aria-label="漢字">　</div>
        <div class="kanji-reading" id="kanjiReading" lang="ja" aria-label="漢字の読み方"></div>
        <div class="hint-container"><div class="hint-text" id="hint" aria-live="polite">ヒントをクリックして表示</div></div>
        <button class="hint-button" id="hintButton" type="button"><i data-lucide="lightbulb" aria-hidden="true"></i> ヒントを見る (3回)</button>
        <div class="emoji-container" id="emojiContainer" aria-label="絵文字を選択" aria-busy="true"><div class="loading">漢字データを読み込んでいます…</div></div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
        <div class="progress-container"><div class="progress-label" id="progressLabel">進捗: 0 / 80</div><div class="progress-bar" role="progressbar" aria-label="進捗" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><div class="progress" id="progress"></div></div></div>
        <div class="achievements" id="achievements" aria-label="実績"></div>
    </main>
    <script src="/js/lucide.min.js"></script>
    <script>
        const GRADE_FILES = {
            grade1: { file: '/data/grade1_kanji_complete.json', label: 'Lớp 1', total: 80 },
            grade2: { file: '/data/grade2_kanji_complete.json', label: 'Lớp 2', total: 190 },
            grade3: { file: '/data/grade3_kanji_complete.json', label: 'Lớp 3', total: 200 }
        };
        const GRADE_STORAGE_KEY = 'noitu_selected_grade';
        const dataCache = new Map();
        const achievements = [
            { name: '初心者', points: 100 }, { name: '中級者', points: 500 },
            { name: '上級者', points: 1000 }, { name: '達人', points: 2000 }
        ];
        const elements = {
            kanji: document.getElementById('kanji'), reading: document.getElementById('kanjiReading'), emojis: document.getElementById('emojiContainer'),
            hintButton: document.getElementById('hintButton'), hint: document.getElementById('hint'),
            score: document.getElementById('score'), grade: document.getElementById('gradeLabel'),
            count: document.getElementById('questionCount'), message: document.getElementById('message'),
            progress: document.getElementById('progress'), progressLabel: document.getElementById('progressLabel'),
            progressBar: document.querySelector('[role="progressbar"]'), achievements: document.getElementById('achievements')
        };
        let selectedGrade = 'grade1';
        let kanjiData = [];
        let currentKanjiIndex = 0;
        let score = 0;
        let hintsUsed = 0;
        let locked = false;
        let roundToken = 0;

        function shuffleArray(items) {
            const shuffled = [...items];
            for (let index = shuffled.length - 1; index > 0; index--) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
            }
            return shuffled;
        }

        async function fetchGrade(grade) {
            if (!dataCache.has(grade)) {
                const request = fetch(GRADE_FILES[grade].file).then(response => {
                    if (!response.ok) throw new Error(`Không thể tải dữ liệu lớp ${grade.slice(-1)} (${response.status}).`);
                    return response.json();
                }).then(records => {
                    if (!Array.isArray(records) || records.length === 0) throw new Error(`Dữ liệu lớp ${grade.slice(-1)} không hợp lệ.`);
                    return records.filter(record => record && typeof record.kanji === 'string' && record.kanji.trim() && typeof record.emoji === 'string' && record.emoji.trim());
                });
                dataCache.set(grade, request);
                request.catch(() => dataCache.delete(grade));
            }
            return dataCache.get(grade);
        }

        async function loadGradeData(grade) {
            const token = ++roundToken;
            selectedGrade = grade;
            document.querySelectorAll('.grade-tab').forEach(tab => tab.setAttribute('aria-pressed', String(tab.dataset.grade === grade)));
            elements.grade.textContent = grade === 'all' ? 'Trộn cả 3 lớp' : GRADE_FILES[grade].label;
            elements.message.textContent = '';
            elements.message.className = 'message';
            elements.emojis.setAttribute('aria-busy', 'true');
            elements.emojis.innerHTML = '<div class="loading">漢字データを読み込んでいます…</div>';
            elements.kanji.textContent = '　';
            elements.reading.textContent = '';
            try {
                const records = grade === 'all'
                    ? (await Promise.all(Object.keys(GRADE_FILES).map(fetchGrade))).flat()
                    : await fetchGrade(grade);
                if (token !== roundToken) return;
                kanjiData = shuffleArray(records);
                currentKanjiIndex = 0;
                localStorage.setItem(GRADE_STORAGE_KEY, grade);
                renderQuestion();
            } catch (error) {
                if (token !== roundToken) return;
                kanjiData = [];
                elements.emojis.innerHTML = '';
                elements.emojis.setAttribute('aria-busy', 'false');
                elements.message.textContent = `${error.message} Trang cần được mở qua ứng dụng web để tải dữ liệu.`;
                elements.message.className = 'message error';
                elements.progress.style.width = '0%';
                elements.progressLabel.textContent = '進捗: 0';
                elements.count.textContent = '0';
            }
        }

        function resetQuestionState() {
            hintsUsed = 0;
            locked = false;
            elements.hint.textContent = 'ヒントをクリックして表示';
            elements.hintButton.disabled = false;
            elements.hintButton.innerHTML = '<i data-lucide="lightbulb" aria-hidden="true"></i> ヒントを見る (3回)';
            elements.message.textContent = '';
            elements.message.className = 'message';
        }

        function renderQuestion() {
            elements.emojis.setAttribute('aria-busy', 'false');
            if (!kanjiData.length) return;
            if (currentKanjiIndex >= kanjiData.length) {
                elements.kanji.textContent = '🎉';
                elements.reading.textContent = '';
                elements.emojis.innerHTML = '';
                elements.message.textContent = 'ゲームクリア！おめでとうございます！';
                elements.message.className = 'message success';
                elements.hintButton.disabled = true;
                updateProgress();
                return;
            }
            resetQuestionState();
            const currentKanji = kanjiData[currentKanjiIndex];
            elements.kanji.textContent = currentKanji.kanji;
            elements.kanji.setAttribute('aria-label', `漢字 ${currentKanji.kanji}`);
            elements.reading.textContent = currentKanji.read || '';
            elements.reading.setAttribute('aria-label', currentKanji.read ? `読み方 ${currentKanji.read}` : '読み方なし');
            elements.count.textContent = `${currentKanjiIndex + 1} / ${kanjiData.length}`;
            updateProgress();
            const correctEmoji = currentKanji.emoji;
            const pool = [...new Set(kanjiData.map(item => item.emoji).filter(emoji => emoji && emoji !== correctEmoji))];
            const choices = shuffleArray([correctEmoji, ...shuffleArray(pool).slice(0, 5)]);
            elements.emojis.innerHTML = '';
            choices.forEach(emoji => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'emoji-item';
                button.textContent = emoji;
                button.setAttribute('aria-label', emoji);
                button.addEventListener('click', () => handleEmojiClick(emoji, button));
                elements.emojis.appendChild(button);
            });
            if (window.lucide) window.lucide.createIcons();
        }

        function handleEmojiClick(selectedEmoji, button) {
            if (locked) return;
            const currentKanji = kanjiData[currentKanjiIndex];
            if (selectedEmoji === currentKanji.emoji) {
                locked = true;
                elements.message.textContent = '正解！';
                elements.message.className = 'message success';
                const points = 10 + ([5, 3, 1, 0][hintsUsed] || 0);
                score += points;
                elements.score.textContent = String(score);
                button.classList.add('correct');
                elements.emojis.querySelectorAll('button').forEach(choice => { choice.disabled = true; });
                updateAchievements();
                const token = roundToken;
                window.setTimeout(() => {
                    if (token !== roundToken) return;
                    currentKanjiIndex++;
                    renderQuestion();
                }, 850);
            } else {
                button.classList.add('incorrect');
                button.disabled = true;
                elements.message.textContent = '不正解！もう一度挑戦してください';
                elements.message.className = 'message error';
                const token = roundToken;
                window.setTimeout(() => {
                    if (token !== roundToken) return;
                    button.classList.remove('incorrect');
                    if (button.isConnected) button.disabled = false;
                }, 650);
            }
        }

        function showHint() {
            if (hintsUsed >= 3 || !kanjiData[currentKanjiIndex]) return;
            const currentKanji = kanjiData[currentKanjiIndex];
            const missing = 'データがありません';
            if (hintsUsed === 0) {
                elements.hint.textContent = `ひらがな: ${currentKanji.read || missing}`;
            } else if (hintsUsed === 1) {
                const meaning = currentKanji.meaning_vi || missing;
                elements.hint.textContent = `意味: ${meaning}${currentKanji.description ? `（${currentKanji.description}）` : ''}`;
            } else {
                const example = currentKanji.example || missing;
                const reading = currentKanji.example_read ? `（${currentKanji.example_read}）` : '';
                elements.hint.textContent = `例文: ${example}${reading}`;
            }
            hintsUsed++;
            if (hintsUsed >= 3) {
                elements.hintButton.disabled = true;
                elements.hintButton.innerHTML = '<i data-lucide="lightbulb" aria-hidden="true"></i> ヒントを使いました';
                if (window.lucide) window.lucide.createIcons();
            } else {
                elements.hintButton.innerHTML = `<i data-lucide="lightbulb" aria-hidden="true"></i> ヒントを見る (残り${3 - hintsUsed}回)`;
                if (window.lucide) window.lucide.createIcons();
            }
        }

        function updateProgress() {
            const total = kanjiData.length;
            const percent = total ? (currentKanjiIndex / total) * 100 : 0;
            elements.progress.style.width = `${percent}%`;
            elements.progressLabel.textContent = `進捗: ${currentKanjiIndex} / ${total}`;
            elements.progressBar.setAttribute('aria-valuemax', String(total));
            elements.progressBar.setAttribute('aria-valuenow', String(currentKanjiIndex));
        }

        function updateAchievements() {
            elements.achievements.innerHTML = '';
            achievements.forEach(achievement => {
                const badge = document.createElement('div');
                const unlocked = score >= achievement.points;
                badge.className = `achievement${unlocked ? '' : ' locked'}`;
                badge.textContent = `${unlocked ? '🔓' : '🔒'} ${achievement.name}`;
                elements.achievements.appendChild(badge);
            });
        }

        document.querySelectorAll('.grade-tab').forEach(tab => tab.addEventListener('click', () => loadGradeData(tab.dataset.grade)));
        elements.hintButton.addEventListener('click', showHint);
        const savedGrade = localStorage.getItem(GRADE_STORAGE_KEY);
        loadGradeData(savedGrade === 'all' || GRADE_FILES[savedGrade] ? savedGrade : 'grade1');
        updateAchievements();
        if (window.lucide) window.lucide.createIcons();
    </script>
</body>
</html>
