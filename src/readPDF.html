<style>
body{
    font-family: Arial, sans-serif;
    background: #f5f5f5;

    margin: 0;
    overflow-x: hidden;
}

/* Toolbar bên trái */

.toolbar{

    position: fixed;

    left: 0;
    top: 0;

    width: 80px;
    height: 100vh;

    display: flex;
    flex-direction: column;

    gap: 8px;

    padding: 10px;

    background: #fff;

    border-right: 1px solid #ddd;

    overflow-y: auto;

    z-index: 1000;
}

/* Nội dung chính */

.main-content{

    margin-left: 30px;

    padding: 10px;

    display: flex;

    justify-content: center;

    align-items: flex-start;
}

/* PDF Viewer */

#viewer{

    position: relative;

    display: inline-block;

    background: #fff;

    border: 1px solid #ccc;

    box-shadow:
        0 2px 10px rgba(0,0,0,.1);

    overflow: hidden;
}

#pdfCanvas{
    display:block;
}

#drawCanvas{

    position:absolute;

    left:0;
    top:0;

    z-index:10;

    cursor:crosshair;
}

/* Buttons */

button{

    padding:8px;

    border:1px solid #ccc;

    border-radius:6px;

    background:white;

    cursor:pointer;

    font-size:20px;

    line-height:1;

    min-height:44px;

    min-width:44px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.lucide {
    width: 24px;
    height: 24px;
    stroke-width: 2.2;
}

.tree-icon {
    width: 16px;
    height: 16px;
    stroke-width: 2;
    margin-right: 6px;
    vertical-align: -2px;
    display: inline-block;
}

button:hover{
    background:#eee;
}

.tool-active{
    background:#1976d2;
    color:white;
}

/* Select */

.toolbar select{

    width:100%;

    height:40px;

    border:1px solid #ccc;

    border-radius:6px;

    background:#fff;

    font-size:35px;

    padding:0 8px;

    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;
}

/* Slider */

input[type="range"]{
    width:100%;
}

/* Info */

.page-info{

    margin-top:10px;

    font-weight:bold;

    text-align:center;
}

/* iPad */

@media (max-width:1024px){

    .toolbar{

        width:70px;
    }

    .main-content{

        margin-left:30px;
    }

    button{

        min-width:56px;

        min-height:56px;

        font-size:22px;
    }

    select,
    input{

        min-height:44px;
    }
}

/* Touch */

.toolbar,
.toolbar button,
.toolbar select,
.toolbar input{

    touch-action: manipulation;
}

.toolbar-left select {

    height: 40px;

    padding: 0 40px 0 12px;

    border: 1px solid #ccc;
    border-radius: 6px;

    background: #fff;
    text-align: center;
    font-size: 20px;
    font-family: inherit;

    cursor: pointer;

    outline: none;

    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    transition: all .2s;
}

.toolbar-left {

    position: fixed;

    left: 0;
    top: 0;

    min-width: 80px;
    max-width: 140px;
    height: 100vh;

    display: flex;
    flex-direction: column;

    gap: 8px;

    padding: 10px;

    background: #fff;

    border-right: 1px solid #ddd;

    overflow-y: auto;

    z-index: 1000;
}

.toolbar-right {

    position: fixed;

    right: 0;
    top: 0;

    width: 80px;
    height: 100vh;

    display: flex;
    flex-direction: column;

    gap: 8px;

    padding: 10px;

    background: #fff;

    border-left: 1px solid #ddd;

    overflow-y: auto;

    z-index: 1000;
}

.color-palette {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 4px;

    width: 100%;

    justify-items: center;
}

.color-item {

    width: 26px;
    height: 26px;

    border: 1px solid #999;

    cursor: pointer;

    border-radius: 4px;

    transition: all .15s ease;
}

.color-item:hover {

    transform: scale(1.1);
}

.color-item.active {

    border: 3px solid #1976d2;

    box-shadow:
        0 0 4px rgba(25,118,210,.5);
}

.toolbar-left,
.toolbar-right,
.toolbar-left button,
.toolbar-right button {

    touch-action: manipulation;

    -webkit-touch-callout: none;

    -webkit-user-select: none;
    user-select: none;
}

#pdfTree {

    width: 250px;

    overflow-y: auto;

    text-align: left;

    font-size: 14px;
}

.tree-folder {

    cursor: pointer;

    padding: 4px;
}

.tree-file {

    cursor: pointer;

    padding: 4px;

    color: #1976d2;
}

.tree-file:hover {

    background: #eef5ff;
}

.tree-children {

    margin-left: 20px;
}

.tree-file.selected {

    background: #1976d2;

    color: white;

    border-radius: 4px;
}
</style>

function renderTree(nodes) {

    const container =
        document.createElement("div");

    nodes.forEach(node => {

        if (node.type === "folder") {

            const folder =
                document.createElement("div");

            folder.className =
                "tree-folder";

            folder.innerHTML =
                '<i data-lucide="folder" class="tree-icon"></i> ' + node.name;

            const children =
                renderTree(
                    node.children
                );

            children.classList.add(
                "tree-children"
            );

            children.style.display =
                "none";

            folder.onclick = () => {

                children.style.display =
                    children.style.display === "none"
                    ? "block"
                    : "none";
            };

            container.appendChild(
                folder
            );

            container.appendChild(
                children
            );

        } else {

            const file =
                document.createElement("div");

            file.className =
                "tree-file";

            file.innerHTML =
                '<i data-lucide="file-text" class="tree-icon"></i> ' + node.name;

            file.onclick = () => {
                document
                        .querySelectorAll(
                            ".tree-file"
                        )
                        .forEach(el =>
                            el.classList.remove(
                                "selected"
                            )
                        );

                    file.classList.add(
                        "selected"
                    );
                openPdfUrl(
                    "/data/pdfs/" + node.relativePath
                );
            };

            container.appendChild(
                file
            );
        }
    });

    return container;
}

async function loadPdfTree() {

    const tree =
        await fetch(
            "/api/pdftree"
        ).then(
            r => r.json()
        );

    const root =
        document.getElementById(
            "pdfTree"
        );

    root.innerHTML = "";

    root.appendChild(
        renderTree(tree)
    );

    if (window.lucide) {
        lucide.createIcons();
    }
}

async function openPdfUrl(url){

    pdfDoc =
        await pdfjsLib
        .getDocument(url)
        .promise;

    currentPage = 1;

    pageCount.textContent =
        pdfDoc.numPages;

    renderPage(currentPage);
}

async function loadPdfList() {

    const response = await fetch(
        "/api/pdfs"
    );

    const files =
        await response.json();

    const select =
        document.getElementById(
            "pdfSelect"
        );

    select.innerHTML =
        '<option value="">📚</option>';

    files.forEach(file => {

        const option =
            document.createElement(
                "option"
            );

        option.value = file;
        option.textContent = "📚" + file;

        select.appendChild(
            option
        );
    });
}

function ensureHistory(page){

    if(!pageHistory[page]){
        pageHistory[page] = [];
    }

    if(!pageRedo[page]){
        pageRedo[page] = [];
    }
}

function saveState(){

    ensureHistory(currentPage);

    pageHistory[currentPage].push(
        drawCanvas.toDataURL()
    );

    pageRedo[currentPage] = [];

    if(pageHistory[currentPage].length > 50){
        pageHistory[currentPage].shift();
    }
}

function restoreCanvas(dataUrl){

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

    if(!dataUrl) return;

    const img = new Image();

    img.onload = ()=>{

        drawCtx.drawImage(
            img,
            0,
            0
        );
    };

    img.src = dataUrl;
}

function hexToRgba(hex, alpha){

    const r =
    parseInt(hex.slice(1,3),16);

    const g =
    parseInt(hex.slice(3,5),16);

    const b =
    parseInt(hex.slice(5,7),16);

    return `rgba(${r},${g},${b},${alpha})`;
}

function updateBrush(){

    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";

    switch(currentTool){

        case "pen":

            drawCtx.globalCompositeOperation =
            "source-over";

            drawCtx.strokeStyle =
            brushColor;

            drawCtx.lineWidth =
            brushSize;

            break;

        case "marker":

            drawCtx.globalCompositeOperation =
            "source-over";

            drawCtx.strokeStyle =
            hexToRgba(
                brushColor,
                0.3
            );

            drawCtx.lineWidth =
            brushSize * 4;

            break;

        case "eraser":

            drawCtx.globalCompositeOperation =
            "destination-out";

            drawCtx.lineWidth =
            brushSize * 2;

            break;
    }
}

function updateToolButtons(){

    [
        penBtn,
        markerBtn,
        eraserBtn
    ].forEach(btn=>{

        btn.classList.remove(
            "tool-active"
        );
    });

    if(currentTool==="pen"){
        penBtn.classList.add(
            "tool-active"
        );
    }

    if(currentTool==="marker"){
        markerBtn.classList.add(
            "tool-active"
        );
    }

    if(currentTool==="eraser"){
        eraserBtn.classList.add(
            "tool-active"
        );
    }
}

async function renderPage(pageNumber){

    if(!pdfDoc) return;

    saveDrawing();

    const page =
    await pdfDoc.getPage(pageNumber);

    const viewer =
    document.getElementById("viewer");

    const containerWidth =
        viewer.parentElement.clientWidth - 20;

    const originalViewport =
        page.getViewport({
            scale: 1.5
        });

    let scale =
    containerWidth /
    originalViewport.width;
    
    if(scale > 1.5){
        scale = 1.5;
    }
    // const viewport = page.getViewport({
    //     scale: scale,
    //     rotation: rotation
    // });

    const fitScale =
    containerWidth /
    originalViewport.width;

    const viewport =
    page.getViewport({
        scale: fitScale * zoomLevel,
        rotation
    });


    pdfCanvas.width =
    viewport.width;

    pdfCanvas.height =
    viewport.height;

    drawCanvas.width =
    viewport.width;

    drawCanvas.height =
    viewport.height;

    await page.render({
        canvasContext:pdfCtx,
        viewport
    }).promise;

    restoreDrawing();

    pageNum.textContent =
    pageNumber;
}

zoomInBtn.onclick = () => {

    zoomLevel += ZOOM_STEP;

    if (
        zoomLevel > MAX_ZOOM
    ) {
        zoomLevel = MAX_ZOOM;
    }

    updateZoomLabel();

    renderPage(currentPage);
};

zoomOutBtn.onclick = () => {

    zoomLevel -= ZOOM_STEP;

    if (
        zoomLevel < MIN_ZOOM
    ) {
        zoomLevel = MIN_ZOOM;
    }

    updateZoomLabel();

    renderPage(currentPage);
};

function updateZoomLabel() {

    document.getElementById(
        "zoomValue"
    ).textContent =
        Math.round(
            zoomLevel * 100
        ) + "%";
}


function saveDrawing(){

    if(!drawCanvas.width) return;

    drawings[currentPage] =
    drawCanvas.toDataURL();
}

function restoreDrawing(){

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

    const data =
    drawings[currentPage];

    if(data){

        const img =
        new Image();

        img.onload = ()=>{

            drawCtx.drawImage(
                img,
                0,
                0
            );
        };

        img.src = data;
    }

    ensureHistory(currentPage);

    if(
        pageHistory[currentPage]
        .length===0
    ){

        pageHistory[currentPage]
        .push(
            drawCanvas.toDataURL()
        );
    }
}

.getElementById("pdfFile")
.addEventListener(
"change",
async(e)=>{

    const file =
    e.target.files[0];

    if(!file) return;

    const buffer =
    await file.arrayBuffer();

    pdfDoc =
    await pdfjsLib
    .getDocument({
        data:buffer
    }).promise;

    currentPage = 1;

    pageCount.textContent =
    pdfDoc.numPages;

    renderPage(currentPage);
});

prevBtn.onclick = ()=>{

    if(
        !pdfDoc ||
        currentPage<=1

    currentPage--;

    renderPage(currentPage);
};

nextBtn.onclick = ()=>{

    if(
        !pdfDoc ||
        currentPage>=pdfDoc.numPages
    ) return;

    clearCurrentCanvas();

    currentPage++;

    renderPage(currentPage);
};

markerBtn.onclick = ()=>{

            item.classList.add(

            );

            brushColor =

            updateBrush();
        }
    );

undoBtn.onclick = ()=>{

    ensureHistory(currentPage);

    const history =
    pageHistory[currentPage];

    const redo =
    pageRedo[currentPage];

    if(history.length<=1)
        return;

    const current =
    history.pop();

    redo.push(current);

    restoreCanvas(
        history[
            history.length-1
        ]
    );

    drawings[currentPage] =
    history[
        history.length-1
    ];
};

redoBtn.onclick = ()=>{

    ensureHistory(currentPage);

    const history =
    pageHistory[currentPage];

    const redo =
    pageRedo[currentPage];

    if(!redo.length)
        return;

    const state =
    redo.pop();

    history.push(state);

    restoreCanvas(state);

    drawings[currentPage] =
    state;
};

clearBtn.onclick = clearCurrentCanvas;

function clearCurrentCanvas() {

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );

    drawings[currentPage] = null;

    ensureHistory(currentPage);

    pageHistory[currentPage] = [
        drawCanvas.toDataURL()
    ];

    pageRedo[currentPage] = [];
}

function getPos(e){

    const rect =
    drawCanvas.getBoundingClientRect();

    return {

        x:
        e.clientX -
        rect.left,

        y:
        e.clientY -
        rect.top
    };
}

drawCanvas.addEventListener(
"mousedown",
e=>{

    updateBrush();

    drawing = true;

    const pos =
    getPos(e);

    drawCtx.beginPath();

    drawCtx.moveTo(
        pos.x,
        pos.y
    );
});

drawCanvas.addEventListener(
"mousemove",
e=>{

    if(!drawing) return;

    const pos =
    getPos(e);

    drawCtx.lineTo(
        pos.x,
        pos.y
    );

    drawCtx.stroke();
});

window.addEventListener(
"mouseup",
()=>{

    if(!drawing) return;

    drawing = false;

    saveState();

    drawings[currentPage] =
    drawCanvas.toDataURL();
});

drawCanvas.addEventListener(
"touchstart",
e=>{

    e.preventDefault();

    updateBrush();

    drawing = true;

    const touch =
    e.touches[0];

    const rect =
    drawCanvas.getBoundingClientRect();

    drawCtx.beginPath();

    drawCtx.moveTo(
        touch.clientX -
        rect.left,

        touch.clientY -
        rect.top
    );
});

drawCanvas.addEventListener(
"touchmove",
e=>{

    e.preventDefault();

    if(!drawing) return;

    const touch =
    e.touches[0];

    const rect =
    drawCanvas.getBoundingClientRect();

    drawCtx.lineTo(
        touch.clientX -
        rect.left,

        touch.clientY -
        rect.top
    );

    drawCtx.stroke();
});

drawCanvas.addEventListener(
"touchend",
()=>{

    if(!drawing) return;

    drawing = false;

    saveState();

    drawings[currentPage] =
    drawCanvas.toDataURL();
});

updateBrush();

if (window.lucide) {
    lucide.createIcons();
}

</script>
